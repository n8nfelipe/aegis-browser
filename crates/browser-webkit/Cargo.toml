[package]
name = "aegis-browser-webkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux WebKitGTK browser backend for Aegis Browser"

[dependencies]
aegis-browser-shell = { path = "../browser-shell" }
aegis-policy-core = { path = "../policy-core" }
aegis-url-adapter = { path = "../url-adapter" }
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
