name: CI e release SemVer

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testar browser
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Instalar dependências GTK/WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Configurar Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache do Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verificar formatação
        run: cargo fmt --all -- --check

      - name: Testar workspace
        run: cargo test --workspace --all-targets

      - name: Testar especificamente o backend do browser
        run: cargo test -p aegis-browser-webkit

      - name: Compilar browser em release
        run: cargo build --release -p aegis-browser-webkit

  semver-tag:
    name: Gerar tag SemVer
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar histórico completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ler e validar versão SemVer
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ -z "${version}" || ! "${version}" =~ ${semver_regex} ]]; then
            echo "A versão do Cargo.toml não é SemVer válida: '${version}'" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Verificar se a tag já existe
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "A tag ${TAG} já existe; nenhuma nova tag será criada."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Criar e publicar tag
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${TAG}" --message "Release ${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"
