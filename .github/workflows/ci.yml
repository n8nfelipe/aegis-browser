name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: aegis-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testar browser
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Instalar dependências GTK/WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Configurar Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache do Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verificar formatação
        run: cargo fmt --all -- --check

      - name: Testar workspace
        run: cargo test --workspace --all-targets

      - name: Testar especificamente o backend do browser
        run: cargo test -p aegis-browser-webkit

      - name: Compilar browser em release
        run: cargo build --release -p aegis-browser-webkit
