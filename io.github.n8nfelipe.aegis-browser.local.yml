# Local checkout build helper. The Flathub submission manifest uses a Git source.
app-id: io.github.n8nfelipe.aegis-browser
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: aegis-browser-webkit
cleanup:
  - /rust
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download
  - --env=GSETTINGS_BACKEND=memory
modules:
  - name: rust-toolchain
    buildsystem: simple
    build-commands:
      - cd rust-x86_64-unknown-linux-gnu && ./install.sh --prefix=/app/rust --without=rust-docs --disable-ldconfig --verbose
    sources:
      - type: archive
        archive-type: tar-xz
        only-arches:
          - x86_64
        dest: rust-x86_64-unknown-linux-gnu
        url: https://static.rust-lang.org/dist/2026-09-03/rust-1.98.1-x86_64-unknown-linux-gnu.tar.xz
        sha256: 5326b36c53de11d148c8f8dab6553a3d1006c2cfd32123683073fad3c302605b
  - name: aegis-browser
    buildsystem: simple
    build-options:
      append-path: /app/rust/bin
      env:
        CARGO_HOME: /run/build/aegis-browser/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --locked
      - cargo --offline build --release --locked --package aegis-browser-webkit
      - install -Dm755 target/release/aegis-browser-webkit /app/bin/aegis-browser-webkit
      - install -Dm644 packaging/flatpak/icons/io.github.n8nfelipe.aegis-browser-512.png /app/share/icons/hicolor/512x512/apps/io.github.n8nfelipe.aegis-browser.png
      - install -Dm644 io.github.n8nfelipe.aegis-browser.desktop /app/share/applications/io.github.n8nfelipe.aegis-browser.desktop
      - install -Dm644 io.github.n8nfelipe.aegis-browser.metainfo.xml /app/share/metainfo/io.github.n8nfelipe.aegis-browser.metainfo.xml
      - install -d /app/share/aegis-browser/extensions
      - cp -a extensions/aegis-privacy-guard extensions/aegis-tracker-blocker /app/share/aegis-browser/extensions/
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - target
          - .flatpak-builder
      - cargo-sources.json
    post-install:
      - install -Dm644 packaging/flatpak/icons/io.github.n8nfelipe.aegis-browser-128.png /app/share/icons/hicolor/128x128/apps/io.github.n8nfelipe.aegis-browser.png
      - install -Dm644 packaging/flatpak/icons/io.github.n8nfelipe.aegis-browser-256.png /app/share/icons/hicolor/256x256/apps/io.github.n8nfelipe.aegis-browser.png
